services:
  - type: web
    name: tg2num-bot
    env: python
    buildCommand: "pip install -r requirements.txt"
    startCommand: "python bot.py"
    envVars:
      - key: BOT_TOKEN
        sync: false
      - key: ADMIN_ID
        sync: false
      - key: DATA_CHANNEL
        value: "-1003946288718"
      - key: PORT
        value: 10000

